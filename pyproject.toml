[project]
name = "livekit-uv-workspace"
version = "0.1.0"
description = "uv workspace root for internal library and LiveKit agent packages"
requires-python = ">=3.10,<3.15"
dependencies = [
    "livekit-agents~=1.5",
]

[tool.uv.workspace]
members = ["packages/internal", "packages/agent"]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livekit_uv_workspace"]

[tool.hatch.build.targets.sdist]
include = ["src/livekit_uv_workspace", "pyproject.toml"]
